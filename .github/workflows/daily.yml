name: Daily feed update

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 05:00 Hong Kong time, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update feed
        run: python scripts/update_feed.py

      - name: Commit & push if changed
        run: |
          git config user.name "hkga-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data/feed.json; then
            git add data/feed.json
            git commit -m "feed: daily update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No feed changes today."
          fi
